<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reef Rivals: Mini-Battle - 3D Projectile Battler</title>
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="game-canvas"></div>

  <!-- HUD Layer -->
  <div id="hud">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand-section">
        <div class="brand-logo">🥥 REEF RIVALS</div>
        <div class="badge-round" id="round-badge">ROUND 1: SCOUT</div>
      </div>

      <div class="turn-banner player-turn" id="turn-banner">
        <span id="turn-indicator-dot">●</span>
        <span id="turn-text">YOUR TURN: AIM & FIRE</span>
      </div>

      <div class="status-actions">
        <div class="wind-badge" id="wind-badge">
          💨 WIND: <span id="wind-val">0.0 m/s</span>
        </div>
        <button class="btn-icon" id="btn-sound" title="Toggle Sound">🔊</button>
        <button class="btn-icon" id="btn-restart" title="Restart Battle">🔄</button>
      </div>
    </header>

    <!-- Health Duel Bars -->
    <section class="health-duel-container">
      <!-- Player HP Card -->
      <div class="hp-card">
        <div class="hp-meta">
          <span>🏄 TUBE HERO</span>
          <span id="player-hp-val">100 / 100</span>
        </div>
        <div class="hp-track">
          <div class="hp-fill player-fill" id="player-hp-bar" style="width: 100%;"></div>
        </div>
      </div>

      <!-- Enemy HP Card -->
      <div class="hp-card">
        <div class="hp-meta">
          <span id="enemy-name-label">🏴‍☠️ PEGLEG PETE</span>
          <span id="enemy-hp-val">80 / 80</span>
        </div>
        <div class="hp-track">
          <div class="hp-fill enemy-fill" id="enemy-hp-bar" style="width: 100%;"></div>
        </div>
      </div>
    </section>

    <!-- Floating Damage / Status Toast Container -->
    <div id="toast-container"></div>

    <!-- Bottom Controls Deck -->
    <footer class="bottom-controls">
      <!-- Ammo Selector -->
      <div class="weapon-selector">
        <button class="weapon-btn active" data-weapon="coconut">
          🥥 Coconut <span class="weapon-count">∞</span>
        </button>
        <button class="weapon-btn" data-weapon="pineapple">
          🍍 Pineapple Bomb <span class="weapon-count" id="count-pineapple">3</span>
        </button>
        <button class="weapon-btn" data-weapon="watermelon">
          🍉 Watermelon Cluster <span class="weapon-count" id="count-watermelon">2</span>
        </button>
      </div>

      <!-- Aim & Power Controls -->
      <div class="control-deck">
        <div class="aim-sliders">
          <div class="slider-group">
            <span>Elevation: <b id="val-elevation">32°</b></span>
            <input type="range" id="slider-elevation" min="12" max="65" value="32">
          </div>
          <div class="slider-group">
            <span>Yaw (Aim): <b id="val-yaw">0°</b></span>
            <input type="range" id="slider-yaw" min="-35" max="35" value="0">
          </div>
        </div>

        <div class="fire-container">
          <button class="btn-fire" id="btn-fire">
            🚀 HOLD TO FIRE
          </button>
          <div class="power-indicator">
            <div class="power-track">
              <div class="power-fill" id="power-bar" style="width: 65%;"></div>
            </div>
            <div class="power-label">POWER: <span id="power-val">65</span>%</div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Victory / Round Clear Modal -->
  <div class="modal-overlay" id="round-modal">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🏆</div>
      <div class="modal-title" id="modal-title">PIRATE RAFT SUNK!</div>
      <div class="modal-desc" id="modal-desc">
        Great marksmanship! The enemy was sent straight into the reef lagoon!
      </div>
      <div class="modal-stats">
        <div>Shots: <b id="stat-shots">4</b></div>
        <div>Accuracy: <b id="stat-accuracy">75%</b></div>
        <div>Score: <b id="stat-score">1250</b></div>
      </div>
      <button class="btn-modal-action" id="btn-modal-next">
        CONTINUE TO ROUND 2 ➔
      </button>
    </div>
  </div>

  <!-- Game Main Script -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
