<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="100%" height="100%">
  <defs>
    <!-- Tentacle Gradients -->
    <linearGradient id="titleTentacleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="35%" stop-color="#7209b7" />
      <stop offset="75%" stop-color="#480ca8" />
      <stop offset="100%" stop-color="#190038" />
    </linearGradient>
    <linearGradient id="titleSuckerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>

    <!-- Ocean Plaque Gradients -->
    <linearGradient id="titleRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f" />
      <stop offset="50%" stop-color="#15616d" />
      <stop offset="100%" stop-color="#072b34" />
    </linearGradient>
    <linearGradient id="titleLagoon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#175666" />
      <stop offset="40%" stop-color="#0c3c47" />
      <stop offset="100%" stop-color="#041f26" />
    </linearGradient>
    <linearGradient id="titleRope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99582a" />
      <stop offset="50%" stop-color="#e29578" />
      <stop offset="100%" stop-color="#6f3810" />
    </linearGradient>
    <linearGradient id="titleBannerWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c431b" />
      <stop offset="45%" stop-color="#5a270f" />
      <stop offset="100%" stop-color="#2e1104" />
    </linearGradient>

    <!-- Golden Text Gradient -->
    <linearGradient id="titleGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="16%" stop-color="#fff8b5" />
      <stop offset="52%" stop-color="#ffb703" />
      <stop offset="85%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d94e00" />
    </linearGradient>

    <!-- Cyan/Aqua Word Gradient -->
    <linearGradient id="titleAquaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbf3f0" />
      <stop offset="60%" stop-color="#2ec4b6" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="titleShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#010e14" flood-opacity="0.65" />
    </filter>
    <filter id="tentacleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- LAYER 1: HANGING ROPES & CEILING RIG           -->
  <!-- ============================================== -->
  <g stroke="url(#titleRope)" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M 230 -10 C 230 45, 275 60, 295 28" />
    <path d="M 510 -10 C 510 45, 465 60, 445 28" />
  </g>
  <circle cx="295" cy="30" r="16" fill="#8c431b" stroke="#ffd991" stroke-width="3.5" />
  <circle cx="445" cy="30" r="16" fill="#8c431b" stroke="#ffd991" stroke-width="3.5" />

  <!-- ============================================== -->
  <!-- LAYER 2: GIANT KRAKEN TENTACLES                -->
  <!-- ============================================== -->
  <!-- Big Left Tentacle curling up & over the rim -->
  <g filter="url(#tentacleShadow)">
    <path d="M 75 360 C 15 310, -25 210, 10 120 C 30 70, 85 45, 105 95 C 115 125, 80 155, 65 190 C 45 235, 75 310, 125 350 Z"
          fill="url(#titleTentacleGrad)" stroke="#ffd166" stroke-width="2.5" />
    <!-- Glowing Suction Cups -->
    <ellipse cx="22" cy="140" rx="10" ry="8" transform="rotate(-30, 22, 140)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="2" />
    <ellipse cx="45" cy="100" rx="11" ry="8.5" transform="rotate(10, 45, 100)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="2" />
    <ellipse cx="80" cy="80" rx="9" ry="7" transform="rotate(45, 80, 80)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="2" />
    <ellipse cx="42" cy="195" rx="8" ry="6.5" transform="rotate(-40, 42, 195)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="1.8" />
  </g>

  <!-- Big Right Tentacle curling down and clutching corner -->
  <g filter="url(#tentacleShadow)">
    <path d="M 665 360 C 725 310, 765 210, 730 120 C 710 70, 655 45, 635 95 C 625 125, 660 155, 675 190 C 695 235, 665 310, 615 350 Z"
          fill="url(#titleTentacleGrad)" stroke="#ffd166" stroke-width="2.5" />
    <!-- Glowing Suction Cups -->
    <ellipse cx="718" cy="140" rx="10" ry="8" transform="rotate(30, 718, 140)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="2" />
    <ellipse cx="695" cy="100" rx="11" ry="8.5" transform="rotate(-10, 695, 100)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="2" />
    <ellipse cx="660" cy="80" rx="9" ry="7" transform="rotate(-45, 660, 80)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="2" />
    <ellipse cx="698" cy="195" rx="8" ry="6.5" transform="rotate(40, 698, 195)" fill="url(#titleSuckerGrad)" stroke="#fff" stroke-width="1.8" />
  </g>

  <!-- ============================================== -->
  <!-- LAYER 3: MAIN PLAQUE SHIELD                    -->
  <!-- ============================================== -->
  <g filter="url(#titleShadow)">
    <!-- Outer Shield Frame -->
    <rect x="45" y="32" width="650" height="350" rx="46" ry="46"
          fill="url(#titleRim)" stroke="#48cae4" stroke-width="6" />

    <!-- Nautical Rope Inlay -->
    <rect x="60" y="47" width="620" height="320" rx="36" ry="36"
          fill="none" stroke="url(#titleRope)" stroke-width="8" stroke-dasharray="16 8" />

    <!-- Deep Lagoon Plaque Face -->
    <rect x="70" y="57" width="600" height="300" rx="28" ry="28"
          fill="url(#titleLagoon)" stroke="#02141a" stroke-width="3" />
  </g>

  <!-- Golden Corner Brackets with Rivets -->
  <g fill="#ffb703" stroke="#7a3e14" stroke-width="2">
    <!-- Top-Left Bracket -->
    <path d="M 68 85 L 68 65 Q 68 55, 78 55 L 105 55 L 95 72 L 85 72 L 85 85 Z" />
    <circle cx="78" cy="65" r="3.5" fill="#fff" />
    <!-- Top-Right Bracket -->
    <path d="M 672 85 L 672 65 Q 672 55, 662 55 L 635 55 L 645 72 L 655 72 L 655 85 Z" />
    <circle cx="662" cy="65" r="3.5" fill="#fff" />
  </g>

  <!-- Water Surface Reflections / Caustics -->
  <path d="M 90 145 Q 230 115, 370 145 T 650 140" fill="none" stroke="#2ec4b6" stroke-width="4" opacity="0.25" />
  <path d="M 110 225 Q 260 195, 410 225 T 630 220" fill="none" stroke="#2ec4b6" stroke-width="3" opacity="0.2" />

  <!-- Tropical Elements: Starfish, Shell, & Anchor -->
  <!-- Top Left: Starfish -->
  <g transform="translate(112, 75)">
    <polygon points="18,0 23,13 36,13 26,22 30,34 18,26 6,34 10,22 0,13 13,13"
             fill="#ff9e00" stroke="#fff5d6" stroke-width="2" />
    <circle cx="18" cy="17" r="3" fill="#ffe3e0" />
  </g>

  <!-- Bottom Left: Golden Seashell -->
  <g transform="translate(100, 290)">
    <path d="M 0 35 C -10 12, 25 -5, 38 10 C 50 25, 25 45, 0 35 Z"
          fill="#ff758f" stroke="#fff0bd" stroke-width="3" />
    <circle cx="20" cy="22" r="8" fill="#fff9eb" stroke="#ffd166" stroke-width="2.5" />
  </g>

  <!-- Bottom Right: Illustrated Brass Anchor with Rope -->
  <g transform="translate(605, 280)">
    <!-- Coiled Rope around Anchor -->
    <path d="M 12 18 Q 30 14, 20 28 Q 10 40, 26 42" fill="none" stroke="#e29578" stroke-width="4" />
    <!-- Anchor Ring -->
    <circle cx="20" cy="12" r="9" fill="none" stroke="#ffd166" stroke-width="4.5" />
    <!-- Anchor Stock & Shank -->
    <line x1="20" y1="21" x2="20" y2="58" stroke="#ffd166" stroke-width="6" stroke-linecap="round" />
    <line x1="6" y1="30" x2="34" y2="30" stroke="#ffd166" stroke-width="5" stroke-linecap="round" />
    <!-- Anchor Flukes -->
    <path d="M 2 44 C 2 68, 38 68, 38 44" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" />
    <!-- Fluke Points -->
    <polygon points="2,40 -2,46 6,46" fill="#ffd166" />
    <polygon points="38,40 34,46 42,46" fill="#ffd166" />
  </g>

  <!-- ============================================== -->
  <!-- LAYER 4: 3D TYPOGRAPHY: KRAKEN'S QUAY          -->
  <!-- ============================================== -->
  <g style="font-family: 'Arial Rounded MT Bold', 'Fredoka', 'Lilita One', system-ui, sans-serif; font-weight: 1000; text-anchor: middle;">

    <!-- Top Word: KRAKEN'S -->
    <!-- Layer A: Shadow Base -->
    <text x="370" y="172" font-size="78" letter-spacing="3" fill="#020e14">KRAKEN'S</text>
    <!-- Layer B: Deep Crimson 3D Bevel -->
    <text x="370" y="167" font-size="78" letter-spacing="3" fill="#540b0e" stroke="#540b0e" stroke-width="22" stroke-linejoin="round">KRAKEN'S</text>
    <!-- Layer C: Vibrant Coral Wall -->
    <text x="370" y="161" font-size="78" letter-spacing="3" fill="#a82030" stroke="#a82030" stroke-width="16" stroke-linejoin="round">KRAKEN'S</text>
    <!-- Layer D: Crisp White Outline -->
    <text x="370" y="155" font-size="78" letter-spacing="3" fill="#fffbe6" stroke="#fffbe6" stroke-width="9" stroke-linejoin="round">KRAKEN'S</text>
    <!-- Layer E: Golden Gloss Face -->
    <text x="370" y="155" font-size="78" letter-spacing="3" fill="url(#titleGoldGrad)">KRAKEN'S</text>

    <!-- Sparkle Glints on KRAKEN'S -->
    <polygon points="175,115 178,124 187,124 180,130 183,139 175,133 167,139 170,130 163,124 172,124" fill="#ffffff" />
    <polygon points="565,112 567.5,119 575,119 569,124 571.5,131 565,126 558.5,131 561,124 555,119 562.5,119" fill="#ffffff" />
  </g>

  <!-- ============================================== -->
  <!-- LAYER 5: LOWER BANNER: "SPLASH & SHOT"         -->
  <!-- ============================================== -->
  <g transform="translate(0, 18)">
    <!-- Banner Chains -->
    <rect x="220" y="196" width="14" height="32" rx="6" fill="#8c431b" stroke="#ffd991" stroke-width="3" />
    <rect x="506" y="196" width="14" height="32" rx="6" fill="#8c431b" stroke="#ffd991" stroke-width="3" />

    <g filter="url(#titleShadow)">
      <!-- Left Swallowtail Ribbon -->
      <polygon points="120,255 165,215 165,295" fill="#2e1104" />
      <polygon points="130,255 168,220 168,290" fill="#5a270f" />
      <!-- Right Swallowtail Ribbon -->
      <polygon points="620,255 575,215 575,295" fill="#2e1104" />
      <polygon points="610,255 572,220 572,290" fill="#5a270f" />

      <!-- Center Heavy Wood Plaque -->
      <rect x="150" y="215" width="440" height="80" rx="22" ry="22"
            fill="url(#titleBannerWood)" stroke="#ffd166" stroke-width="5" />
      <!-- Brass Corner Studs -->
      <circle cx="170" cy="235" r="5.5" fill="#ffb703" stroke="#fff" stroke-width="2" />
      <circle cx="570" cy="235" r="5.5" fill="#ffb703" stroke="#fff" stroke-width="2" />
      <circle cx="170" cy="275" r="5.5" fill="#ffb703" stroke="#fff" stroke-width="2" />
      <circle cx="570" cy="275" r="5.5" fill="#ffb703" stroke="#fff" stroke-width="2" />
    </g>

    <!-- Subtitle: SPLASH & SHOT -->
    <g style="font-family: 'Arial Rounded MT Bold', 'Fredoka', 'Lilita One', system-ui, sans-serif; font-weight: 1000; text-anchor: middle;">
      <!-- Deep Shadow -->
      <text x="370" y="272" font-size="38" letter-spacing="4" fill="#010e14">SPLASH &amp; SHOT</text>
      <!-- Deep Navy Extrusion -->
      <text x="370" y="268" font-size="38" letter-spacing="4" fill="#022a33" stroke="#022a33" stroke-width="12" stroke-linejoin="round">SPLASH &amp; SHOT</text>
      <!-- Crisp White Stroke -->
      <text x="370" y="264" font-size="38" letter-spacing="4" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">SPLASH &amp; SHOT</text>
      <!-- Aqua/Cyan Front Fill -->
      <text x="370" y="264" font-size="38" letter-spacing="4" fill="url(#titleAquaGrad)">SPLASH &amp; SHOT</text>
    </g>

    <!-- Cannonball Accents flanking subtitle -->
    <circle cx="198" cy="254" r="8" fill="#1b263b" stroke="#adb5bd" stroke-width="2" />
    <circle cx="542" cy="254" r="8" fill="#1b263b" stroke="#adb5bd" stroke-width="2" />
  </g>

  <!-- Water Splash Droplets along the base -->
  <circle cx="140" cy="365" r="4.5" fill="#48cae4" />
  <circle cx="152" cy="375" r="3" fill="#90e0ef" />
  <circle cx="590" cy="365" r="4.5" fill="#48cae4" />
  <circle cx="578" cy="375" r="3" fill="#90e0ef" />
</svg>
