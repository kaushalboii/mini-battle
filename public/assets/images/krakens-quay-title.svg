<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <!-- Ocean Plaque Gradients -->
    <linearGradient id="plaqueRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#268a9c" />
      <stop offset="50%" stop-color="#0f4b59" />
      <stop offset="100%" stop-color="#072b34" />
    </linearGradient>

    <linearGradient id="plaqueInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#146073" />
      <stop offset="40%" stop-color="#0d414f" />
      <stop offset="100%" stop-color="#05252e" />
    </linearGradient>

    <!-- Rope Texture Gradient -->
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a46d33" />
      <stop offset="50%" stop-color="#e8bf7a" />
      <stop offset="100%" stop-color="#8a531e" />
    </linearGradient>

    <!-- Golden Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fff9a6" />
      <stop offset="55%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Turquoise Subtitle Gradient -->
    <linearGradient id="aquaText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ffff" />
      <stop offset="40%" stop-color="#26e8e8" />
      <stop offset="100%" stop-color="#00a896" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#582a17" />
      <stop offset="12%" stop-color="#8f4a22" />
      <stop offset="70%" stop-color="#5c2b14" />
      <stop offset="100%" stop-color="#341508" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="plaqueDrop" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#02141a" flood-opacity="0.55" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hanging Ropes (Top) -->
  <g stroke="url(#ropeGrad)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M 230 -10 C 230 45, 270 55, 290 25" />
    <path d="M 490 -10 C 490 45, 450 55, 430 25" />
  </g>
  <!-- Rope Knots -->
  <circle cx="288" cy="30" r="14" fill="#a46d33" stroke="#ffd991" stroke-width="3" />
  <circle cx="432" cy="30" r="14" fill="#a46d33" stroke="#ffd991" stroke-width="3" />

  <!-- Main Plaque Frame -->
  <g filter="url(#plaqueDrop)">
    <!-- Outer Rim -->
    <rect x="25" y="24" width="670" height="348" rx="42" ry="42" fill="url(#plaqueRim)" stroke="#39b0c7" stroke-width="6" />
    <!-- Rope Inlay Border -->
    <rect x="37" y="36" width="646" height="324" rx="34" ry="34" fill="none" stroke="url(#ropeGrad)" stroke-width="7" stroke-dasharray="14 7" />
    <!-- Inner Deep Lagoon Plaque -->
    <rect x="45" y="44" width="630" height="308" rx="28" ry="28" fill="url(#plaqueInner)" />
  </g>

  <!-- Water Ripples / Caustics Effect on Lagoon -->
  <path d="M 65 140 Q 200 110, 360 145 T 655 135" fill="none" stroke="#25c9c3" stroke-width="4" opacity="0.22" />
  <path d="M 75 220 Q 240 185, 420 225 T 645 205" fill="none" stroke="#25c9c3" stroke-width="3" opacity="0.18" />
  <path d="M 120 80 Q 280 60, 480 85 T 620 75" fill="none" stroke="#68e8df" stroke-width="2.5" opacity="0.2" />

  <!-- Corner Ocean Accents -->
  <!-- Top Left: Seashell & Pearl -->
  <g transform="translate(62, 58)">
    <path d="M 0 28 C -8 10, 20 -4, 30 8 C 40 20, 20 36, 0 28 Z" fill="#ff7f74" stroke="#fff0bd" stroke-width="3" />
    <circle cx="16" cy="18" r="7" fill="#fff9eb" stroke="#ffd166" stroke-width="2" />
    <!-- Starfish -->
    <polygon points="40,24 43,33 52,33 45,39 48,48 40,42 32,48 35,39 28,33 37,33" fill="#ffb703" stroke="#fff" stroke-width="1.5" />
  </g>

  <!-- Top Right: Tropical Coral Branch -->
  <g transform="translate(615, 52)">
    <path d="M 10 38 Q 15 15, 30 18 Q 38 8, 25 2 Q 10 -4, 5 12 Q -8 18, -4 28 Q 0 42, 10 38 Z" fill="#f72585" stroke="#ffe3f1" stroke-width="2.5" />
    <circle cx="28" cy="16" r="3.5" fill="#ffd166" />
    <circle cx="-1" cy="24" r="3" fill="#ffd166" />
  </g>

  <!-- Bottom Left: Gold Shell Coin -->
  <g transform="translate(68, 305)">
    <circle cx="16" cy="16" r="18" fill="#ffb703" stroke="#fff5d3" stroke-width="3" />
    <path d="M 8 16 Q 16 6, 24 16 Q 16 26, 8 16 Z" fill="#fb8500" />
    <circle cx="34" cy="24" r="10" fill="#ffd166" stroke="#fff5d3" stroke-width="2" />
  </g>

  <!-- Bottom Right: Brass Anchor -->
  <g transform="translate(615, 290)">
    <circle cx="20" cy="12" r="7" fill="none" stroke="#ffb703" stroke-width="3.5" />
    <line x1="20" y1="19" x2="20" y2="48" stroke="#ffb703" stroke-width="4.5" stroke-linecap="round" />
    <line x1="10" y1="26" x2="30" y2="26" stroke="#ffb703" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 7 36 C 7 54, 33 54, 33 36" fill="none" stroke="#ffb703" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- ============================================== -->
  <!-- MAIN TITLE: "KRAKEN'S QUAY"                    -->
  <!-- ============================================== -->
  <g style="font-family: 'Arial Rounded MT Bold', 'Fredoka', 'Lilita One', system-ui, -apple-system, sans-serif; font-weight: 1000; text-anchor: middle;">

    <!-- Layer 1: Deep Navy Drop Shadow -->
    <text x="360" y="180" font-size="76" letter-spacing="3" fill="#03161c">
      KRAKEN'S QUAY
    </text>
    <text x="360" y="176" font-size="76" letter-spacing="3" fill="#03161c">
      KRAKEN'S QUAY
    </text>

    <!-- Layer 2: Deep Crimson / Coral 3D Extrusion -->
    <text x="360" y="172" font-size="76" letter-spacing="3" fill="#7a1a28" stroke="#7a1a28" stroke-width="22" stroke-linejoin="round">
      KRAKEN'S QUAY
    </text>

    <!-- Layer 3: Vibrant Coral Mid-Tone -->
    <text x="360" y="167" font-size="76" letter-spacing="3" fill="#cf3341" stroke="#cf3341" stroke-width="16" stroke-linejoin="round">
      KRAKEN'S QUAY
    </text>

    <!-- Layer 4: Cream / White Outer Outline -->
    <text x="360" y="162" font-size="76" letter-spacing="3" fill="#fffbe6" stroke="#fffbe6" stroke-width="10" stroke-linejoin="round">
      KRAKEN'S QUAY
    </text>

    <!-- Layer 5: Golden Gloss Front Fill -->
    <text x="360" y="162" font-size="76" letter-spacing="3" fill="url(#goldText)">
      KRAKEN'S QUAY
    </text>
  </g>

  <!-- ============================================== -->
  <!-- SUBTITLE BANNER: "SPLASH & SHOT"               -->
  <!-- ============================================== -->
  <g transform="translate(0, 10)">
    <!-- Hanging Chain Links -->
    <rect x="220" y="196" width="14" height="28" rx="6" fill="#a46d33" stroke="#ffd991" stroke-width="2.5" />
    <rect x="486" y="196" width="14" height="28" rx="6" fill="#a46d33" stroke="#ffd991" stroke-width="2.5" />

    <!-- Wooden Ribbon Banner Base -->
    <g filter="url(#plaqueDrop)">
      <!-- Left Ribbon Swallowtail -->
      <polygon points="120,250 160,215 160,285" fill="#3d1808" />
      <polygon points="128,250 162,220 162,280" fill="#5c2b14" />
      <!-- Right Ribbon Swallowtail -->
      <polygon points="600,250 560,215 560,285" fill="#3d1808" />
      <polygon points="592,250 558,220 558,280" fill="#5c2b14" />

      <!-- Center Ribbon Plaque -->
      <rect x="150" y="215" width="420" height="70" rx="20" ry="20" fill="url(#ribbonGrad)" stroke="#ffd782" stroke-width="4.5" />
      <!-- Golden Corner Studs -->
      <circle cx="168" cy="232" r="5" fill="#ffb703" stroke="#fff" stroke-width="1.5" />
      <circle cx="552" cy="232" r="5" fill="#ffb703" stroke="#fff" stroke-width="1.5" />
      <circle cx="168" cy="268" r="5" fill="#ffb703" stroke="#fff" stroke-width="1.5" />
      <circle cx="552" cy="268" r="5" fill="#ffb703" stroke="#fff" stroke-width="1.5" />
    </g>

    <!-- Decorative Anchors Beside Subtitle -->
    <!-- Left Icon (Squid / Splash) -->
    <text x="195" y="262" font-size="28" text-anchor="middle">🦑</text>
    <!-- Right Icon (Target / Shot) -->
    <text x="525" y="262" font-size="28" text-anchor="middle">🎯</text>

    <!-- Subtitle Text: "SPLASH & SHOT" -->
    <g style="font-family: 'Arial Rounded MT Bold', 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 900; text-anchor: middle;">
      <!-- Deep Shadow -->
      <text x="360" y="266" font-size="34" letter-spacing="4" fill="#1b0802">
        SPLASH &amp; SHOT
      </text>
      <!-- White Stroke -->
      <text x="360" y="262" font-size="34" letter-spacing="4" fill="#00353f" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
        SPLASH &amp; SHOT
      </text>
      <!-- Aqua Glow Fill -->
      <text x="360" y="262" font-size="34" letter-spacing="4" fill="url(#aquaText)">
        SPLASH &amp; SHOT
      </text>
    </g>
  </g>
</svg>
