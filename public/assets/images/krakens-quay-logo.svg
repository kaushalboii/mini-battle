<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="100%" height="100%">
  <defs>
    <!-- Tentacle Gradients -->
    <linearGradient id="tentacleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="40%" stop-color="#7b2cbf" />
      <stop offset="85%" stop-color="#5a189a" />
      <stop offset="100%" stop-color="#240046" />
    </linearGradient>
    <linearGradient id="suckerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>

    <!-- Plaque & Wood Gradients -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f" />
      <stop offset="45%" stop-color="#196f7c" />
      <stop offset="100%" stop-color="#0a3642" />
    </linearGradient>
    <linearGradient id="shieldWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144b57" />
      <stop offset="30%" stop-color="#0d353e" />
      <stop offset="100%" stop-color="#061e24" />
    </linearGradient>
    <linearGradient id="bannerWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0522d" />
      <stop offset="50%" stop-color="#6e3314" />
      <stop offset="100%" stop-color="#3d1908" />
    </linearGradient>

    <!-- Golden Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#fff69b" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="85%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d95d00" />
    </linearGradient>

    <!-- Aqua Highlight Gradient -->
    <linearGradient id="aquaGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ffff" />
      <stop offset="50%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#020e14" flood-opacity="0.65" />
    </filter>
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- LAYER 1: KRAKEN TENTACLES (Behind Shield)      -->
  <!-- ============================================== -->
  <!-- Left Tentacle curling up -->
  <g filter="url(#heavyShadow)">
    <path d="M 45 135 C 15 110, -5 65, 12 30 C 22 10, 48 2, 54 22 C 58 35, 42 46, 35 60 C 28 75, 42 110, 68 130 Z"
          fill="url(#tentacleGrad)" stroke="#ffb703" stroke-width="1.5" />
    <!-- Suckers on left tentacle -->
    <ellipse cx="14" cy="42" rx="5" ry="4" transform="rotate(-20, 14, 42)" fill="url(#suckerGrad)" stroke="#fff" stroke-width="1" />
    <ellipse cx="25" cy="22" rx="5.5" ry="4.5" transform="rotate(15, 25, 22)" fill="url(#suckerGrad)" stroke="#fff" stroke-width="1" />
    <ellipse cx="44" cy="18" rx="4.5" ry="3.5" transform="rotate(40, 44, 18)" fill="url(#suckerGrad)" stroke="#fff" stroke-width="1" />
  </g>

  <!-- Right Tentacle curling down -->
  <g filter="url(#heavyShadow)">
    <path d="M 315 135 C 345 110, 365 70, 348 35 C 338 12, 312 6, 306 25 C 302 38, 318 48, 325 62 C 332 78, 318 112, 292 130 Z"
          fill="url(#tentacleGrad)" stroke="#ffb703" stroke-width="1.5" />
    <!-- Suckers on right tentacle -->
    <ellipse cx="346" cy="45" rx="5" ry="4" transform="rotate(20, 346, 45)" fill="url(#suckerGrad)" stroke="#fff" stroke-width="1" />
    <ellipse cx="335" cy="25" rx="5.5" ry="4.5" transform="rotate(-15, 335, 25)" fill="url(#suckerGrad)" stroke="#fff" stroke-width="1" />
    <ellipse cx="316" cy="20" rx="4.5" ry="3.5" transform="rotate(-40, 316, 20)" fill="url(#suckerGrad)" stroke="#fff" stroke-width="1" />
  </g>

  <!-- ============================================== -->
  <!-- LAYER 2: SHIELD PLAQUE BASE                    -->
  <!-- ============================================== -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Shield Shape with Cut Corners -->
    <path d="M 45 22 L 315 22 Q 335 22, 335 42 L 335 98 Q 335 125, 180 142 Q 25 125, 25 98 L 25 42 Q 25 22, 45 22 Z"
          fill="url(#shieldRim)" stroke="#52b788" stroke-width="3.5" />

    <!-- Inner Lagoon Plaque -->
    <path d="M 50 28 L 310 28 Q 328 28, 328 46 L 328 95 Q 328 118, 180 134 Q 32 118, 32 95 L 32 46 Q 32 28, 50 28 Z"
          fill="url(#shieldWood)" stroke="#1b3a4b" stroke-width="2" />

    <!-- Rope Inlay Border -->
    <path d="M 53 32 L 307 32 Q 322 32, 322 47 L 322 93 Q 322 114, 180 128 Q 38 114, 38 93 L 38 47 Q 38 32, 53 32 Z"
          fill="none" stroke="#d4a373" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
  </g>

  <!-- Brass Rivets on Shield Corners -->
  <circle cx="38" cy="35" r="3.5" fill="#ffd166" stroke="#a0522d" stroke-width="1" />
  <circle cx="322" cy="35" r="3.5" fill="#ffd166" stroke="#a0522d" stroke-width="1" />
  <circle cx="180" cy="136" r="3.5" fill="#ffd166" stroke="#a0522d" stroke-width="1" />

  <!-- Tropical Waves / Caustics Accent -->
  <path d="M 50 62 Q 115 50, 180 62 T 310 60" fill="none" stroke="#2ec4b6" stroke-width="2" opacity="0.3" />
  <path d="M 60 88 Q 125 76, 180 88 T 300 86" fill="none" stroke="#2ec4b6" stroke-width="1.8" opacity="0.25" />

  <!-- Mini Illustrated Anchor (Top Center Accent) -->
  <g transform="translate(180, 26) scale(0.65)">
    <circle cx="0" cy="-6" r="5" fill="none" stroke="#ffd166" stroke-width="2.5" />
    <line x1="0" y1="-1" x2="0" y2="14" stroke="#ffd166" stroke-width="3" stroke-linecap="round" />
    <line x1="-7" y1="4" x2="7" y2="4" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -9 10 C -9 19, 9 19, 9 10" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ============================================== -->
  <!-- LAYER 3: 3D ARCADE TYPOGRAPHY "KRAKEN'S QUAY"  -->
  <!-- ============================================== -->
  <g style="font-family: 'Arial Rounded MT Bold', 'Fredoka', 'Lilita One', system-ui, sans-serif; font-weight: 1000; text-anchor: middle;">

    <!-- Line 1: KRAKEN'S -->
    <!-- Extrusion / Deep Drop Shadow -->
    <text x="180" y="66" font-size="34" letter-spacing="2" fill="#1b0008">KRAKEN'S</text>
    <text x="180" y="64" font-size="34" letter-spacing="2" fill="#540b0e" stroke="#540b0e" stroke-width="10" stroke-linejoin="round">KRAKEN'S</text>
    <text x="180" y="61" font-size="34" letter-spacing="2" fill="#9e2a2b" stroke="#9e2a2b" stroke-width="7" stroke-linejoin="round">KRAKEN'S</text>
    <text x="180" y="58" font-size="34" letter-spacing="2" fill="#fff5d6" stroke="#fff5d6" stroke-width="4.5" stroke-linejoin="round">KRAKEN'S</text>
    <text x="180" y="58" font-size="34" letter-spacing="2" fill="url(#goldTextGrad)">KRAKEN'S</text>

    <!-- Sparkle Stars on KRAKEN'S -->
    <polygon points="98,42 100,47 105,47 101,50 102,55 98,52 94,55 95,50 91,47 96,47" fill="#ffffff" />
    <polygon points="262,40 263.5,44 268,44 264.5,47 266,51 262,48 258,51 259.5,47 256,44 260.5,44" fill="#ffffff" />

    <!-- Line 2: QUAY (Super Chunky Anchor Word) -->
    <!-- Extrusion / Deep Drop Shadow -->
    <text x="180" y="96" font-size="33" letter-spacing="3" fill="#03161c">QUAY</text>
    <text x="180" y="94" font-size="33" letter-spacing="3" fill="#073b4c" stroke="#073b4c" stroke-width="9" stroke-linejoin="round">QUAY</text>
    <text x="180" y="91" font-size="33" letter-spacing="3" fill="#118ab2" stroke="#118ab2" stroke-width="6" stroke-linejoin="round">QUAY</text>
    <text x="180" y="89" font-size="33" letter-spacing="3" fill="#ffffff" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">QUAY</text>
    <text x="180" y="89" font-size="33" letter-spacing="3" fill="url(#aquaGleam)">QUAY</text>
  </g>

  <!-- ============================================== -->
  <!-- LAYER 4: LOWER WOODEN SCROLL: SPLASH & SHOT    -->
  <!-- ============================================== -->
  <g transform="translate(0, -2)">
    <!-- Scroll Shadow -->
    <rect x="76" y="104" width="208" height="26" rx="10" ry="10" fill="#020e14" opacity="0.6" />

    <!-- Wooden Scroll Base -->
    <rect x="74" y="102" width="212" height="25" rx="8" ry="8"
          fill="url(#bannerWood)" stroke="#ffd166" stroke-width="2" />

    <!-- Brass End Caps with Rivets -->
    <path d="M 74 102 L 86 102 L 86 127 L 74 127 Z" fill="#6e3314" stroke="#ffd166" stroke-width="1.5" />
    <circle cx="80" cy="114.5" r="2" fill="#ffd166" />
    <path d="M 286 102 L 274 102 L 274 127 L 286 127 Z" fill="#6e3314" stroke="#ffd166" stroke-width="1.5" />
    <circle cx="280" cy="114.5" r="2" fill="#ffd166" />

    <!-- Tiny Cannonballs flanking subtitle -->
    <circle cx="98" cy="114.5" r="3.5" fill="#1f2421" stroke="#ced4da" stroke-width="1" />
    <circle cx="262" cy="114.5" r="3.5" fill="#1f2421" stroke="#ced4da" stroke-width="1" />

    <!-- Subtitle Text -->
    <text x="180" y="119" font-family="'Arial Rounded MT Bold', 'Fredoka', 'Trebuchet MS', system-ui, sans-serif"
          font-weight="900" font-size="12" letter-spacing="2.5" text-anchor="middle"
          fill="#000000">SPLASH &amp; SHOT</text>
    <text x="180" y="118" font-family="'Arial Rounded MT Bold', 'Fredoka', 'Trebuchet MS', system-ui, sans-serif"
          font-weight="900" font-size="12" letter-spacing="2.5" text-anchor="middle"
          fill="#ffea00">SPLASH &amp; SHOT</text>
  </g>

  <!-- Little Water Splash Droplets -->
  <circle cx="65" cy="128" r="2.5" fill="#48cae4" />
  <circle cx="72" cy="133" r="1.8" fill="#90e0ef" />
  <circle cx="295" cy="128" r="2.5" fill="#48cae4" />
  <circle cx="288" cy="133" r="1.8" fill="#90e0ef" />
</svg>
