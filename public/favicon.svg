<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bg)" stroke="url(#rim)" stroke-width="14" />

  <!-- Speed Stripes -->
  <path d="M 80 180 L 180 180 L 150 215 L 60 215 Z" fill="#ffffff" opacity="0.12" />
  <path d="M 60 235 L 140 235 L 115 270 L 45 270 Z" fill="#ffffff" opacity="0.08" />

  <!-- Checkered Accent in Top Right -->
  <g opacity="0.25">
    <rect x="360" y="70" width="30" height="30" fill="#ffffff" />
    <rect x="420" y="70" width="30" height="30" fill="#ffffff" />
    <rect x="390" y="100" width="30" height="30" fill="#ffffff" />
    <rect x="360" y="130" width="30" height="30" fill="#ffffff" />
    <rect x="420" y="130" width="30" height="30" fill="#ffffff" />
  </g>

  <!-- Stylized High-Speed Race Truck / Supercar Silhouette -->
  <g filter="url(#glow)">
    <!-- Nitrous Flame Exhaust -->
    <path d="M 120 330 C 70 340, 50 365, 30 380 C 60 375, 95 365, 130 355 Z" fill="url(#flame)" />
    <path d="M 140 345 C 90 360, 70 380, 50 400 C 80 390, 115 375, 150 365 Z" fill="#38bdf8" opacity="0.8" />

    <!-- Chassis Body -->
    <path d="M 110 335 
             L 150 250 
             Q 180 190, 240 175 
             L 330 175 
             Q 370 180, 410 240 
             L 450 290 
             Q 465 315, 450 335 
             L 420 340 
             Q 400 300, 360 300 
             Q 320 300, 300 340 
             L 210 340 
             Q 190 300, 150 300 
             Q 125 300, 110 335 Z" 
          fill="url(#gold)" stroke="#ffffff" stroke-width="6" />

    <!-- Cabin / Windshield -->
    <path d="M 235 195 
             L 325 195 
             Q 350 200, 375 245 
             L 205 245 
             Q 215 210, 235 195 Z" 
          fill="#0f172a" stroke="#60a5fa" stroke-width="4" />

    <!-- Cockpit Glare -->
    <path d="M 250 205 L 305 205 L 285 235 L 235 235 Z" fill="#93c5fd" opacity="0.6" />

    <!-- Wheels (Front & Rear) -->
    <!-- Front Wheel -->
    <circle cx="360" cy="335" r="42" fill="#0f172a" stroke="url(#gold)" stroke-width="8" />
    <circle cx="360" cy="335" r="22" fill="#334155" />
    <circle cx="360" cy="335" r="10" fill="#facc15" />
    
    <!-- Rear Wheel -->
    <circle cx="155" cy="335" r="42" fill="#0f172a" stroke="url(#gold)" stroke-width="8" />
    <circle cx="155" cy="335" r="22" fill="#334155" />
    <circle cx="155" cy="335" r="10" fill="#facc15" />

    <!-- Racing Spoiler / Wing -->
    <path d="M 95 240 L 155 240 L 140 260 L 95 255 Z" fill="#ef4444" stroke="#ffffff" stroke-width="4" />
    <path d="M 120 258 L 125 295 L 115 295 Z" fill="#ffffff" />

    <!-- Headlight Beam -->
    <polygon points="445,285 500,270 495,310 440,305" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Speed Chevron Accents at Bottom -->
  <path d="M 210 430 L 235 410 L 255 410 L 230 430 Z" fill="#facc15" />
  <path d="M 245 430 L 270 410 L 290 410 L 265 430 Z" fill="#facc15" opacity="0.8" />
  <path d="M 280 430 L 305 410 L 325 410 L 300 430 Z" fill="#facc15" opacity="0.6" />
</svg>
