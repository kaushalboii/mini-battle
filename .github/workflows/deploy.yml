name: Build, Deploy & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

  create-release:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tagger
        run: |
          VERSION="v2.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Release ${{ steps.tagger.outputs.tag }} - Kraken's Quay: Splash & Shot"
          body: |
            ## 🦑 Kraken's Quay: Splash & Shot (${{ steps.tagger.outputs.tag }})

            🎮 **Play Live Game on GitHub Pages**:
            👉 [https://kaushalboii.github.io/mini-battle/](https://kaushalboii.github.io/mini-battle/)

            ### 🚀 Premium 4K Tropical Turn-Based Projectile Battle:
            - **Three Unique Weapons**: Coconut (∞ basic), Pineapple Bomb (3× explosive), Watermelon Split (2× cluster)
            - **Dynamic Wind System**: Crosswind affects every shot trajectory
            - **Power Charging Mechanic**: Hold FIRE to charge, release to shoot with precision
            - **Drag-to-Aim Controls**: Intuitive 3D canvas drag + slider fine-tuning
            - **3 Escalating Rounds**: Scout Skiff → Twin Corsair → Dread Boss
            - **Procedural Audio**: Web Audio API synthesis (no external files)
            - **Premium Visuals**: PBR materials, dynamic water, particles, camera shake
            - **Responsive Design**: Mobile-friendly, landscape & portrait support
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
