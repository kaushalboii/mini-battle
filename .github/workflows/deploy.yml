name: Build, Deploy & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Deploy to GitHub Pages via gh-pages branch
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.git,.github,node_modules'

  # 2. Create GitHub Release on every push
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release Tag
        id: tagger
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Release ${{ steps.tagger.outputs.tag }} - Mini-Battle: Reef Rivals"
          body: |
            ## 🌴 Mini-Battle: Reef Rivals (${{ steps.tagger.outputs.tag }})

            🎮 **Play Live Game**:
            👉 [https://kaushalboii.github.io/mini-battle/](https://kaushalboii.github.io/mini-battle/)

            ### 🚀 Updates in this release:
            - **3D Tropical Lagoon**: Low-poly water with dynamic wave displacement & raft buoyancy
            - **Turn-Based Projectile Combat**: 3 escalating pirate rounds with AI targeting
            - **Ballistics Trajectory Preview**: 3D parabolic arc with gravity and crosswind
            - **Multi-Ammo Arsenal**: Coconuts, Explosive Pineapples, and Watermelon Cluster Bombs
            - **Cinematic Follow Cam**: Dynamic camera tracking projectile flight
            - **Web Audio API**: 100% procedural sound effects (cannon, splash, hit, fanfare)
            - **CLAUDE.md Guide**: Integrated development guide for Claude and AI coding agents
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
