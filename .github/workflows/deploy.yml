name: Build, Deploy & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

  create-release:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tagger
        run: |
          VERSION="v2.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Release ${{ steps.tagger.outputs.tag }} - Starter Kit Racing 3D"
          body: |
            ## 🏎️ Starter Kit Racing 3D (${{ steps.tagger.outputs.tag }})

            🎮 **Play Live Game on GitHub Pages**:
            👉 [https://kaushalboii.github.io/mini-battle/](https://kaushalboii.github.io/mini-battle/)

            ### 🚀 Kenney's Starter Kit Racing 3D Port:
            - **3D Vehicle Physics**: Arcade truck driving model with steering, drifting, and suspension roll
            - **Dynamic Drift Marks**: Streaming real-time tire skid ribbons on the asphalt
            - **Particle Smoke Trails**: World-space drift smoke puffs emitted from rear wheels
            - **Multi-Gear Procedural Audio**: 3-speed transmission, RPM curves, lowpass throttle filter, and skid screech
            - **2D Lap Timer HUD**: Lap counter, current lap time, last lap, and persistent best lap
            - **Follow Camera**: Dynamic lead vector, smoothing, and look-at target
            - **Touch & Gamepad Controls**: Mobile on-screen joystick and steering pedals
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
