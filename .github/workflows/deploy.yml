name: Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create GitHub Release on every push
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tagger
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Release ${{ steps.tagger.outputs.tag }} - Mini-Battle: Reef Rivals"
          body: |
            ## 🌴 Mini-Battle: Reef Rivals (${{ steps.tagger.outputs.tag }})

            🎮 **Play Live Game on GitHub Pages**:
            👉 [https://kaushalboii.github.io/mini-battle/](https://kaushalboii.github.io/mini-battle/)

            ### 🚀 Highlights in this release:
            - **3D Tropical Lagoon**: Animated low-poly water with dynamic wave displacement & raft buoyancy
            - **Turn-Based Projectile Combat**: 3 escalating pirate rounds with AI targeting
            - **Ballistics Trajectory Preview**: 3D parabolic arc preview with gravity and crosswind
            - **Multi-Ammo Arsenal**: Coconuts, Explosive Pineapples, and Watermelon Cluster Bombs
            - **Cinematic Follow Cam**: Dynamic camera tracking projectile flight
            - **Web Audio API**: 100% procedural sound effects (cannon, splash, hit, fanfare)
            - **CLAUDE.md Guide**: Integrated development guide for Claude and AI coding agents
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
