name: Deploy GitHub Pages & Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Automatically create a Release on each push
  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tagger
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Release ${{ steps.tagger.outputs.tag }} - Mini-Battle: Reef Rivals"
          body: |
            ## 🌴 Mini-Battle: Reef Rivals (${{ steps.tagger.outputs.tag }})

            🚀 **Live Demo on GitHub Pages**:
            👉 [https://kaushalboii.github.io/mini-battle/](https://kaushalboii.github.io/mini-battle/)

            ### 🎮 Features in this release:
            - **3D Tropical Lagoon**: Animated vertex water waves with raft buoyancy & tilt physics
            - **Turn-Based Projectile Combat**: 3 escalating pirate rounds with AI targeting
            - **Ballistics Trajectory Preview**: Dynamic 3D arc preview with gravity and crosswind
            - **Multi-Ammo Arsenal**: Coconuts, Explosive Pineapples, and Watermelon Cluster Bombs
            - **Dynamic Chase Camera**: Cinematic follow cam tracking projectile flight
            - **Web Audio API Engine**: 100% procedural sound effects (cannon, splash, hit, fanfare)
            - **CLAUDE.md Guide**: Ready for development with Claude Code and AI assistants
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
