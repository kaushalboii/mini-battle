name: Build, Deploy & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

  create-release:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tagger
        run: |
          VERSION="v2.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Release ${{ steps.tagger.outputs.tag }} - RevSector 3D Grand Prix Edition"
          body: |
            ## 🏎️ RevSector 3D (${{ steps.tagger.outputs.tag }})
            Engineered by **Kaushal**.

            🎮 **Play Live Game on GitHub Pages**:
            👉 [https://kaushalboii.github.io/mini-battle/](https://kaushalboii.github.io/mini-battle/)

            ### 🏁 RevSector 3D Motorsport Engine:
            - **Formula 1 Live Timing Tower**: Broadcast-grade field leaderboard with live driver intervals, tyre compounds (Soft, Medium, Hard), and S1/S2/S3 sector trackers
            - **15-LED Shift Light Bar**: 5 Green, 5 Red, 5 Blue LEDs with redline upshift flashing (>92% RPM)
            - **Grand Prix 20-Tile Circuit**: Authentic 20-cell circuit with high-speed Curva Grande, 6-cell Back Straight, Ascari Chicane, and Parabolica
            - **Trackside 3D Architecture**: Overhead FIA Start/Finish timing gantry, alternating grid slots (P1-P6), and pitwall armco barriers
            - **Dual-Thumb Mobile Architecture**: Responsive landscape steering paddles and progressive acceleration/braking pedals
            - **Dynamic Drift Physics**: Clean repositioned drift HUD with real-time tire smoke particle trails and rubber skid ribbons
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
